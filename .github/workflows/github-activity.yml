name: Update GitHub activity

on:
  schedule:
    # Four runs a day, UTC. Off the hour to reduce scheduling congestion.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the snapshot branch
        run: |
          if git ls-remote --exit-code --heads origin github-activity; then
            git fetch origin github-activity
            git worktree add --detach activity-output FETCH_HEAD
          else
            git worktree add --detach activity-output HEAD
            cd activity-output
            git checkout --orphan github-activity
            git rm -rf .
          fi

      - name: Summarize public activity with Claude
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GITHUB_ACTIVITY_USERNAME: debba
        run: node --experimental-strip-types scripts/update-github-activity.mjs activity-output/activity.json

      - name: Publish the snapshot
        working-directory: activity-output
        run: |
          # This branch holds data only; never build it as a Vercel preview.
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add activity.json vercel.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public GitHub activity [skip ci]'
            git push origin HEAD:refs/heads/github-activity
          fi
