version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
      time: '04:00'
    open-pull-requests-limit: 10
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      next-major:
        patterns:
          - next
          - eslint-config-next
        update-types:
          - major
